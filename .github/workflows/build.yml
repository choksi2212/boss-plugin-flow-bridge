name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# The reusable workflow pushes a version bump commit back to main; it needs
# write access. Without this, github-actions[bot] gets 403 on push and the
# whole release run fails before the build even runs.
permissions:
  contents: write

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      boss_plugin_api_version: 'latest'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
